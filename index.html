<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chart Guesser</title>
  <meta name="description" content="Real charts with their titles and units hidden. Can you tell what they show?">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213d'/%3E%3Crect x='6' y='7' width='20' height='4' rx='1' fill='%23ffd23f'/%3E%3Cpath d='M6 25 L12 19 L17 22 L26 14' fill='none' stroke='%23ffffff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" id="brand" href="./">Chart Guesser</a>
      <div class="stats" id="stats" hidden>
        <span>Chart<b id="stat-n">1</b></span>
        <span>Score<b id="stat-score">0</b></span>
      </div>
    </header>

    <main id="screen">
      <noscript><p>Chart Guesser needs JavaScript to run.</p></noscript>
    </main>

    <footer class="foot">
      <span>Sources are shown after each answer.</span>
      <a href="builder.html">Build your own question</a>
    </footer>
  </div>

  <div id="announcer" class="visually-hidden" aria-live="polite"></div>

  <script src="lib/chart.umd.min.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
